services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hotel
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
    ports: ["5432:5432"]
  app:
    build: .
    depends_on: [db]
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/hotel
      DB_USERNAME: hotel
      DB_PASSWORD: hotel
      PORT: 8080
    ports: ["8080:8080"]
