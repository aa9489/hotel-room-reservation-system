services:
  - type: web
    name: hotel-room-reservation-system
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DDL_AUTO
        value: update
      - key: DATABASE_URL
        fromDatabase:
          name: hotel-room-reservation-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: hotel-room-reservation-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: hotel-room-reservation-db
          property: password

databases:
  - name: hotel-room-reservation-db
    databaseName: hotel
    user: hotel_app
    plan: basic-256mb
    region: singapore


